name: Check lessons and publish site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate graph and lessons
        run: node .claude/skills/learning-database/scripts/ld.mjs check
      - name: Build site
        run: node .claude/skills/learning-database/scripts/ld.mjs site --out _site
        env:
          LEARNING_DB_HOME: ${{ runner.temp }}/ld
      - name: Build skill zip
        run: node tools/package.mjs && cp dist/learning-database.zip _site/learning-database.zip
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: _site

  deploy:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
